<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ResumeAI — Account</title>
    <meta
      name="description"
      content="Sign in or create your ResumeAI account."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <nav class="nav" id="main-nav">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
          </svg>
        </div>
        ResumeAI
      </a>
      <div class="nav-acts">
        <button class="theme-btn" data-theme-toggle aria-label="Toggle theme">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
        <a class="btn btn-ghost" href="index.html">Back to site</a>
      </div>
    </nav>

    <main class="auth-main">
      <div class="auth-bg"></div>
      <div class="auth-grid"></div>
      <div class="auth-content">
        <div class="auth-eyebrow">
          <i data-lucide="shield" style="width: 12px; height: 12px"></i>
          Secure Access
        </div>
        <h1 class="auth-heading">Welcome back to <em>ResumeAI</em></h1>
        <p class="auth-sub">
          Sign in to save analysis history, compare roles, and export reports.
          New here? Create an account in seconds.
        </p>

        <div class="auth-card">
          <div class="auth-tabs" role="tablist">
            <button
              class="tab-btn active"
              data-tab="signin"
              role="tab"
              aria-selected="true"
            >
              Sign In
            </button>
            <button
              class="tab-btn"
              data-tab="signup"
              role="tab"
              aria-selected="false"
            >
              Sign Up
            </button>
          </div>

          <div class="auth-panels">
            <div class="auth-panel active" id="panel-signin" role="tabpanel">
              <label class="field-label" for="signin-email">Email</label>
              <input
                class="field-input"
                id="signin-email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
              />

              <label class="field-label" for="signin-password">Password</label>
              <input
                class="field-input"
                id="signin-password"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />

              <button class="btn btn-primary full" id="signin-btn">
                <i data-lucide="log-in" style="width: 16px; height: 16px"></i>
                Sign In
              </button>
            </div>

            <div class="auth-panel" id="panel-signup" role="tabpanel">
              <label class="field-label" for="signup-name">Full Name</label>
              <input
                class="field-input"
                id="signup-name"
                type="text"
                placeholder="Jane Doe"
                autocomplete="name"
              />

              <label class="field-label" for="signup-email">Email</label>
              <input
                class="field-input"
                id="signup-email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
              />

              <label class="field-label" for="signup-password">Password</label>
              <input
                class="field-input"
                id="signup-password"
                type="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
              />

              <button class="btn btn-primary full" id="signup-btn">
                <i
                  data-lucide="user-plus"
                  style="width: 16px; height: 16px"
                ></i>
                Create Account
              </button>
            </div>

            <div class="auth-panel" id="panel-forgot" role="tabpanel">
              <label class="field-label" for="forgot-email">Email</label>
              <input
                class="field-input"
                id="forgot-email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
              />

              <button class="btn btn-primary full" id="forgot-btn">
                <i data-lucide="mail" style="width: 16px; height: 16px"></i>
                Send Reset Link
              </button>
              <p class="form-note">
                We will email you a secure reset link. It expires in 15 minutes.
              </p>
            </div>
          </div>

          <div class="auth-forgot">
            <a href="#" class="inline-link" id="forgot-link">Forgot password</a>
          </div>

          <div
            class="auth-status"
            id="auth-status"
            role="status"
            aria-live="polite"
          ></div>
        </div>
      </div>
    </main>

    <script type="module" src="auth.js"></script>
  </body>
</html>
